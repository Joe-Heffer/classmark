[project]
name = "classmark"
version = "0.1.0"
description = "Classify research datasets against controlled vocabularies with calibrated confidence (Data Director evaluation prototype)"
authors = [
    { name = "Joe Heffer", email = "jheffer@gmail.com" }
]
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "anthropic>=1.13.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "typesafe-sdk>=0.7.4",
]

[project.optional-dependencies]
scientific = [
    "h5py>=3.16.0",
    "netcdf4>=1.7.4",
]

[project.scripts]
classmark = "classmark.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
